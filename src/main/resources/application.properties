# Oracle
spring.datasource.url=jdbc:oracle:thin:@//localhost:1521/XEPDB1
spring.datasource.username=SYSTEM
spring.datasource.password=mypassword
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver


#spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.default_schema=SYSTEM


spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.sql.init.mode=always
spring.jpa.open-in-view=false

# src/main/resources/application.properties
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true



# ===============================
# Kafka Producer (Spring Kafka)
# ===============================
# Bootstrap servers:
# - Fuera de Docker (host): localhost:9094
# - Dentro del compose: setea KAFKA_BOOTSTRAP_SERVERS=kafka:9092
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9094}

# Serializadores
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.group-id=libros-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

# Desactivar commit automático
spring.kafka.consumer.enable-auto-commit=false

# Necesario para commits manuales
spring.kafka.listener.ack-mode=manual

# Producer con Avro/Schema Registry
#spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
#spring.kafka.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8081}


# Incluir header de tipo para el JsonSerializer (util al consumir)
spring.kafka.properties.spring.json.add.type.headers=true

# Fiabilidad (idempotencia + acks)
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.acks=all
spring.kafka.producer.retries=10
spring.kafka.producer.delivery-timeout=120000
spring.kafka.producer.max-in-flight-requests-per-connection=5

# Rendimiento (batching)
spring.kafka.producer.linger-ms=5
spring.kafka.producer.batch-size=32768

# Topic por defecto para tus envios (lo usas en tu servicio)
app.kafka.topic=libros-events